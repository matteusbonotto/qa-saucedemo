name: Testes automatizados

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automacao
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: automacao/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Instalar o navegador
        run: npx playwright install --with-deps chromium

      - name: Rodar os testes
        run: npx playwright test

      - name: Gerar arquivo para o QAlor
        if: always()
        env:
          LINK_RELATORIO: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/qalor-export.mjs

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: automacao/playwright-report
          retention-days: 30

      - name: Publicar arquivo do QAlor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qalor-execucao
          path: automacao/resultados/qalor-execucao.json
          retention-days: 30
